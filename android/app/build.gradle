// The Android app: a full-screen WebView onto the staged site, which tools/android-release.sh copies into
// src/main/assets/site (git-ignored). No dependencies beyond the platform. The release build is unsigned here;
// the release script signs it with a key kept outside the repository.
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.virtastic.d2web'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.virtastic.d2web'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(project.findProperty('d2VersionCode') ?: '1')
        versionName project.findProperty('d2VersionName') ?: '0.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The engine and the archives are read with Range requests; stored uncompressed they open as file
    // descriptors and seek instead of inflating from the start.
    androidResources {
        noCompress += ['wasm', 'mpq', 'dc6']
    }
}
