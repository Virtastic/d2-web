<!doctype html>
<meta charset="utf-8">
<title>d2-web</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<!-- iOS has no manifest support: Add to Home Screen reads these instead. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D2 Web">
<link rel="apple-touch-icon" href="assets/icon.svg">
<script>
// Test-only viewport override for wasm-build/scenarios/s320: the
// harness launches one fixed-size Chrome window (no CDP resize yet, "Proving it"),
// so this lets a scenario ask the SAME CSS the real 100dvw/100dvh path uses to letterbox the canvas
// at a second, different size. Absent (and inert) on every real visit.
(() => {
  const m = /[?&]viewport=(\d+)x(\d+)/.exec(location.search);
  if (!m) return;
  document.documentElement.style.setProperty('--d2-vw', m[1] + 'px');
  document.documentElement.style.setProperty('--d2-vh', m[2] + 'px');
})();
</script>
<style>
  :root{color-scheme:dark;--d2-vw:100dvw;--d2-vh:100dvh} *{box-sizing:border-box}
  body{background:#050505;color:#ccc;font:14px monospace;margin:0;min-height:100dvh;display:grid;place-items:center}
  main{width:min(var(--d2-vw),1000px);padding:16px}
  h1{font:26px/30px Georgia,serif;height:30px;color:#c9ad68;margin:0 0 10px;letter-spacing:.08em}
  /* the largest 4:3 box that fits BOTH main's own width budget (unchanged) and the viewport's
     height (new) -- width is the min of the two so aspect-ratio (definite width -> derived height)
     never needs to guess; margin:auto centres it when the height term wins. The -60px is what sits
     above it in the window: main's 16px padding, the 30px heading and its 10px margin, #viewport's border. */
  #viewport{position:relative;border:1px solid #493d27;background:#080a08;box-shadow:0 8px 40px #000;
    width:min(100%, (var(--d2-vh) - 60px) * 4 / 3);aspect-ratio:4/3;margin:0 auto}
  canvas{display:block;width:100%;height:100%;outline:none;image-rendering:pixelated}
  #hud{position:absolute;left:12px;top:10px;margin:0;color:#ddd;text-shadow:1px 1px #000;pointer-events:none;line-height:1.45}
  #session-bar{display:flex;align-items:center;gap:12px;margin:.55rem 0}.controls{color:#756c5a;font-size:12px}
  #session-status{color:#958968;flex:1}select{background:#100f0c;color:#c9ad68;border:1px solid #493d27;padding:4px 8px}
  #log{max-height:8rem;overflow:auto;color:#777;font-size:11px;white-space:pre-wrap}
  /* the game is the page. The heading, session bar, key list and debug log are a
     desktop developer's chrome -- on a phone held sideways they made the page taller than the screen --
     so a coarse pointer drops them and the 4:3 box takes the largest size the whole screen allows. */
  @media (pointer: coarse){
    main{width:var(--d2-vw);padding:0}
    h1,#session-bar,.controls,#log,#hud{display:none}
    #viewport{border:0;box-shadow:none;width:min(100%, var(--d2-vh) * 4 / 3)}
  }
  #unsupported{display:none;max-width:560px;padding:20px 24px;margin-top:8px;border:1px solid #493d27;background:#0b0c09;line-height:1.6}
  #unsupported h2{color:#c9ad68;margin:0 0 10px;font:20px Georgia,serif}
  #unsupported .detail{color:#8a8069;font-size:12px;margin:.4em 0 0}
  body.unsupported #viewport,body.unsupported #session-bar,body.unsupported .controls,body.unsupported #log{display:none}
  body.unsupported #unsupported{display:block}
</style>
<main>
  <h1>DIABLO II · WEB</h1>
  <!-- The screen is written from the probe's answer (unsupportedMessage), not from the markup: the
       cause is not always the browser. A capable browser served without COOP/COEP gets a sentence
       that says so, instead of being told it cannot run the game. -->
  <div id="unsupported" role="alert">
    <h2>Can't run here</h2>
    <p><strong data-field="summary"></strong></p>
    <p><span data-field="advice"></span></p>
    <p class="detail"><span data-field="browser"></span> · missing <span data-field="missing"></span></p>
    <p class="detail" data-field="runs-today">Runs today on <span data-field="supported"></span>.</p>
  </div>
  <div id="viewport"><canvas id="game" width="800" height="600" tabindex="0" aria-label="Diablo II game viewport"></canvas><pre id="hud"></pre><div id="touch-overlay"></div></div>
  <div id="session-bar"><div id="session-status">starting engine…</div><label>Class <select id="class-select" disabled></select></label></div>
  <div class="controls">Move: WASD / arrows / left click · Attack: Space · Right skill: 1 Attack, 2 Throw, 3 Kick · Use: right click · Interact / exit: E · Travel (caravan): T · Inventory: I · Respawn: R · Cancel: Esc</div>
  <pre id="log"></pre>
</main>
<script type="module" src="gameplay-shell.mjs"></script>
<script type="module" src="assets/input-controller.mjs"></script>
<script type="module" src="assets/input-touch.mjs"></script>
<!-- version-engine.sh rewrites this src into e/<hash>/ alongside the engine. -->
<script src="streamfs.js"></script>
<script>
// M0 smoke page. Boots the engine, mounts the synthetic smoke.mpq through streamfs, reads a
// file out of it via StormLib in wasm, and publishes the result on window.__d2 for the
// harness. ?retail=1 also mounts the retail MPQs served at /retail/ (see serve.mjs) into the
// layered VFS, in retail priority order. Everything real replaces this in M3/M5.
const RETAIL_ORDER = ['patch_d2.mpq', 'd2exp.mpq', 'd2xmusic.mpq', 'd2xtalk.mpq', 'd2xvideo.mpq', 'd2data.mpq', 'd2char.mpq', 'd2music.mpq', 'd2sfx.mpq', 'd2speech.mpq', 'd2video.mpq'];
const log = (s) => { document.getElementById('log').textContent += s + '\n'; console.log(s); };
window.__d2 = { ready: false, smoke: null, error: null };
// Stamped by version-engine.sh; untouched placeholder = local dev, engine next to this page.
const VER = '__ENGINE_VERSION__';
const ENGINE_DIR = VER.startsWith('__') ? '' : 'e/' + VER + '/';
function showUnsupported(info) {
  const set = (f, v) => { document.querySelector(`#unsupported [data-field=${f}]`).textContent = v; };
  set('summary', info.summary);
  set('advice', info.advice);
  set('browser', info.browser);
  set('missing', info.missing.join(' and '));
  set('supported', info.supportedBrowsers);
  // The browser list is an answer to "which browsers run this"; when the browser is fine and the
  // DELIVERY is what is wrong, listing browsers is noise that reads as "yours is not one of them".
  document.querySelector('#unsupported [data-field=runs-today]').style.display = info.supportedBrowsers ? '' : 'none';
  document.body.classList.add('unsupported');
}
// A boot that does not complete says so ON THE SCREEN (issue 3: "never a crash or
// a blank page"). Two measured ways a player met a page that never finished instead:
//   * a host that never answers: the boot's own deadline fires and `window.__d2.error` names the host
//     and the wait, but nothing was ever shown -- the page read "starting engine…" for ever;
//   * the engine starting and then stalling: measured in a real WebKit (Playwright's build, Safari
//     26.6 UA, 2026-09-26) the first streamfs read times out in its worker and rejects a promise
//     nothing awaits -- the console says "streamfs: read timeout <url>" while the player sits on
//     "loading…" with no error anywhere on the page.
// This reuses the unsupported panel (one screen, one stylesheet): the capability lines do not apply to
// a boot failure, so they are hidden rather than left blank.
function showBootFailure(why) {
  if (document.body.classList.contains('unsupported')) return;   // a real capability screen already spoke
  const set = (f, v) => { const el = document.querySelector(`#unsupported [data-field=${f}]`); if (el) el.textContent = v; };
  document.querySelector('#unsupported h2').textContent = "Can't start here";
  set('summary', 'The game did not start.');
  set('advice', why);
  for (const el of document.querySelectorAll('#unsupported .detail')) el.style.display = 'none';
  document.body.classList.add('unsupported');
}
(async () => {
  try {
    // Capability probe, run before anything else touches the engine:
    // crossOriginIsolated (COOP/COEP -> SharedArrayBuffer -> streamfs) and Memory64 (the engine's
    // build,. Missing either gets a readable screen naming the
    // browser and what runs the game -- never an exception in the debug log below.
    // Test-only switches (wasm-build/scenarios/s321, s328), for asserting the screen in a browser
    // that actually supports the engine. Each forces missing only the capability named, and keeps the
    // REAL answer for the other -- so the screen the row reads is the one a person in that state sees,
    // not a state invented for the test:
    //   `?unsupported=1`          both missing (the generic browser-fault screen, s321)
    //   `?unsupported=isolated`   cross-origin isolation only: a capable browser served without
    //                             COOP/COEP (the host-fault screen, s328)
    //   `?unsupported=memory64`   Memory64 only: the state an Apple browser is in when the page IS
    //                             served right (Safari has COOP/COEP and no Memory64) -- row issue 2's
    //                             screen. No browser on this box reaches it unaided, and that is a
    //                             measurement, not an assumption: the only WebKit here is Playwright's
    //                             own build (`~/.cache/ms-playwright/webkit-2359`), and it answers
    //                             probeMemory64 TRUE -- its `WebAssembly.validate` of this repo's probe
    //                             bytes is true, and a module that really declares and uses an i64
    //                             memory (`memory.size` -> i64) compiles, instantiates and returns the
    //                             right size (measured 2026-09-26; V8 24.19 answers identically, and
    //                             this V8 has no flag that removes Memory64 -- `node --v8-options`
    //                             lists none). Playwright's WebKit is a Linux port of the engine, not
    //                             shipping Safari, so it is NOT the Apple state 
    //                             records (caniuse: no Safari ships Memory64) and cannot stand in for
    //                             it; Apple's real position is re-opened only by a measurement on a
    //                             shipping Apple browser. What that WebKit DID show is the other
    //                             honest path: it started the engine and then stalled on its first
    //                             streamfs read (the issue 9 Firefox mechanism -- a worker's fetch needs a
    //                             main thread this page never yields), which is what showBootFailure
    //                             below was written for.
    const { probeCapabilities, unsupportedMessage } = await import('./assets/platform-probe.mjs');
    const force = /[?&]unsupported=([\w,]+)/.exec(location.search);
    const forced = force ? (force[1] === '1' ? ['isolated', 'memory64'] : force[1].split(',')) : [];
    const real = force ? probeCapabilities() : null;
    const caps = force
      ? { crossOriginIsolated: forced.includes('isolated') ? false : real.crossOriginIsolated,
          memory64: forced.includes('memory64') ? false : real.memory64,
          supported: false }
      : probeCapabilities();
    if (!caps.supported) {
      const info = unsupportedMessage(caps);
      window.__d2Platform = { ...caps, ...info };
      showUnsupported(info);
      window.__d2 = { ready: true, smoke: null, error: null };
      log('unsupported: ' + info.text);
      return;
    }
    window.__d2Platform = caps;
    // A failure that lands before the engine is up IS the boot failing, whether anything awaited it or
    // not -- and it arrives two ways, so both are listened for: as an unhandled rejection (measured in
    // a real WebKit) and as an uncaught error thrown out of the engine's own synchronous read, which is
    // what a stalled read does in Chrome and Firefox (measured 2026-09-26: `streamfs: read timeout
    // <url>` out of fetchChunkSync, with the engine never reaching `ready`). Either way the player used
    // to keep reading "loading…" with nothing anywhere on the page.
    const bootFailed = (why) => {
      if (window.__d2?.ready) return;   // the engine came up; a later failure is not a boot failure
      const msg = String(why);
      log('ERROR ' + msg);
      window.__d2 = { ready: true, smoke: null, error: msg, streamfs: window.__streamfsStats };
      showBootFailure(msg);
    };
    addEventListener('unhandledrejection', (ev) => bootFailed((ev.reason && (ev.reason.message || ev.reason)) || ev.reason));
    addEventListener('error', (ev) => bootFailed(ev.message || (ev.error && ev.error.message) || ev.type || ev));
    // Every request this page makes before the engine exists carries a deadline (
    // issue 11). A host that accepts a connection and then never answers used to hang the boot here with
    // nothing in the log at all: the page never finished loading, nothing was thrown, and on Firefox --
    // where the engine's own reads are synchronous, with the browser's network timeout as their only
    // bound (play/streamfs.js) -- the first read that followed froze the tab for the better part of a
    // minute. Failing at the deadline turns that into a named error, at the moment it is known, before
    // the engine can start. `?bootDeadline=<ms>` shortens it and `?bootUrl=<url>` points the first
    // request at another host, both test switches for wasm-build/scenarios/s329-browser-stalled-host.
    const bootDeadlineParam = /[?&]bootDeadline=(\d+)/.exec(location.search);
    const BOOT_DEADLINE_MS = Math.max(1, bootDeadlineParam ? Number(bootDeadlineParam[1]) : 15000);
    const bootUrlParam = /[?&]bootUrl=([^&]+)/.exec(location.search);
    const SMOKE_URL = bootUrlParam ? decodeURIComponent(bootUrlParam[1]) : 'smoke.mpq';
    async function fetchBounded(url, init, what) {
      const ac = new AbortController();
      const timer = setTimeout(() => ac.abort(), BOOT_DEADLINE_MS);
      try {
        return await fetch(url, Object.assign({ signal: ac.signal }, init));
      } catch (err) {
        if (err && err.name === 'AbortError')
          throw new Error(`${what} did not answer within ${BOOT_DEADLINE_MS}ms -- the host accepted the ` +
            `request and then stalled`);
        throw err;
      } finally { clearTimeout(timer); }
    }
    const head = await fetchBounded(SMOKE_URL, { method: 'HEAD' }, SMOKE_URL);
    if (!head.ok) throw new Error(SMOKE_URL + ': HTTP ' + head.status);
    const size = Number(head.headers.get('content-length'));
    // init + wait for the worker BEFORE the engine exists: the first sync read must not race
    // the worker's own startup (see streamfs.js, 'd2-web divergence').
    StreamFS.init();
    await StreamFS.ready();
    // Retail MPQs: HEAD each for its size, mount only the ones the server has (build.sh links
    // retail/D2/*.mpq plus the 1.13c core's Patch_D2.mpq into one dir for serve.mjs).
    const wantRetail = /[?&]retail=1/.test(location.search);
    const retail = [];
    if (wantRetail) for (const f of RETAIL_ORDER) {
      const h = await fetchBounded('retail/' + f, { method: 'HEAD' }, 'retail/' + f);
      if (h.ok) retail.push({ f, size: Number(h.headers.get('content-length')) });
    }
    window.Module = {
      locateFile: (p) => ENGINE_DIR + p,
      print: log, printErr: log,
      preRun: [() => {
        StreamFS.mount('/smoke.mpq', SMOKE_URL, size);
        log('streamfs: mounted /smoke.mpq (' + size + ' bytes)');
        if (retail.length) FS.mkdir('/retail');   // makeNode needs the parent dir to exist
        for (const r of retail) StreamFS.mount('/retail/' + r.f, 'retail/' + r.f, r.size);
        if (retail.length) log('streamfs: mounted ' + retail.length + ' retail MPQs');
      }],
      onRuntimeInitialized() {
        const r = Module.ccall('d2_smoke_mpq', 'string', ['string', 'string'], ['/smoke.mpq', 'smoke.txt']);
        const i32 = Module.ccall('d2_smoke_i32', 'number', [], []);
        let vfs = 0;
        for (const m of retail) vfs += Module.ccall('d2_vfs_mount', 'number', ['string'], ['/retail/' + m.f]);
        window.__d2 = { ready: true, smoke: r, i32, streamfs: StreamFS.stats(), retail: vfs, error: null };
        // Retail-gated probes for the test runner.
        window.__d2.txt = (name) => Module.ccall('d2_txt_probe', 'string', ['string'], [name]);
        // Vector replay for the test runner: run one prng record, return {low, high, hash}.
        window.__d2.prng = (low, high, nMax, count) => {
          const out = Module._malloc(12);
          Module.ccall('d2_prng_check', null, ['number', 'number', 'number', 'number', 'bigint'], [low >>> 0, high >>> 0, nMax >>> 0, count >>> 0, BigInt(out)]);
          const r = Array.from(Module.HEAPU32.subarray(out >> 2, (out >> 2) + 3)); Module._free(out); return r;
        };
        log('smoke: ' + r + '  i32: ' + i32);
      },
    };
    const s = document.createElement('script'); s.src = ENGINE_DIR + 'd2.js'; document.head.appendChild(s);
  } catch (e) { window.__d2 = { ready: true, smoke: null, error: String(e) }; log('ERROR ' + e); showBootFailure(String(e)); }
})();
</script>
