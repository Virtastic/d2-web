# electron-builder configuration for the d2-web desktop app. Driven by tools/desktop-release.sh, which first
# copies the staged site into app-site/ (shipped as extraResources, outside the asar, so the page's
# Range reads are plain file reads).
#
# Nothing here signs or notarizes. There is no Apple Developer ID and no Windows certificate: the macOS
# and Windows builds are unsigned, and the README says how a player opens them once.
appId: io.github.virtastic.d2-web
productName: Diablo II (d2-web)
artifactName: "d2-web-${version}-${os}-${arch}.${ext}"
copyright: "Copyright (c) the d2-web project"
directories:
  output: dist
  app: .
files:
  - main.mjs
  - preload.cjs
  - lib/**/*
  - package.json
extraResources:
  - from: app-site
    to: site
    filter:
      - "**/*"
asar: true
npmRebuild: false
publish: null
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Game
  syncDesktopName: true
  icon: build/icon.png
  desktop:
    entry:
      Name: Diablo II (d2-web)
      StartupWMClass: d2-web
  synopsis: Diablo II 1.13c in the browser engine, as a desktop app
  description: "A window onto the d2-web engine. Bring your own Diablo II 1.13c install; no game data is included."
  maintainer: "d2-web project"
  vendor: "d2-web project"
# rpmbuild stamps the build machine's host name into the package; a fixed generic one keeps it private.
rpm:
  fpm:
    - "--rpm-rpmbuild-define=_buildhost localhost"
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  category: public.app-category.games
  icon: build/icon.icns
  identity: null
  hardenedRuntime: false
  notarize: false
  entitlements: null
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  # Unsigned: no certificate, so nothing is signed. rcedit (under wine here) still stamps the icon and version.
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "d2-web-${version}-win-${arch}-setup.${ext}"
portable:
  artifactName: "d2-web-${version}-win-${arch}-portable.${ext}"
